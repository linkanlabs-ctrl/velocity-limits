# Installs the published wheels (not a local build) and runs the full test suite and the demo against
# them, on every platform the wheels support.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  WHEELS: https://github.com/linkanlabs-ctrl/velocity-limits/releases/expanded_assets/v0.1.0

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the published wheel
        run: python -m pip install "velocity-limits[limits]" --only-binary velocity-limits --find-links ${{ env.WHEELS }}
      - name: Show what was installed
        run: python -c "import platform, velocity_limits; print(velocity_limits.__version__, platform.system(), platform.machine(), velocity_limits.__file__)"
      - name: Run the test suite against it
        run: python -m unittest discover -s tests -v
      - name: Run the demo
        run: python -m velocity_limits.demo
